name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Validate and index release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # Go has no registry upload: the tag on the public repo is the release.
      # This step just asks the module proxy to index it immediately.
      - name: Warm module proxy
        env:
          GOPROXY: https://proxy.golang.org
        run: |
          cd "$(mktemp -d)"
          go mod init warmup
          go list -m github.com/hot-dev/hot-go@${{ github.ref_name }}
